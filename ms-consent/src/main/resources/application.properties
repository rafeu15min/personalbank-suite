# ==========================================================
# 1. CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ==========================================================
quarkus.application.name=ms-consent
# Porta HTTP para a API que o frontend irá consumir
quarkus.http.port=8083

# ==========================================================
# 2. CONFIGURAÇÃO COMPARTILHADA DAS INSTITUIÇÕES
# ==========================================================
# Caminho relativo à pasta do módulo (quarkus:dev). No docker compose é
# sobrescrito por QUARKUS_CONFIG_LOCATIONS=/config/banks.yml.
quarkus.config.locations=../config/banks.yml

# ==========================================================
# 3. FLUXO DE CONSENTIMENTO
# ==========================================================
# client_id registrado no banco e URL do callback deste serviço
personalbank.consent.client-id=${CONSENT_CLIENT_ID:personalbank-local}
personalbank.consent.redirect-uri=${CONSENT_REDIRECT_URI:http://localhost:8083/api/consents/callback}
# Chave AES-256 (Base64) que protege os tokens no banco de dados. Sem padrão de
# propósito: gere uma com `openssl rand -base64 32` e coloque no .env.
personalbank.token-encryption-key=${TOKEN_ENCRYPTION_KEY}

# ==========================================================
# 4. BANCO DE DADOS
# ==========================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:personalbank}
quarkus.datasource.password=${DB_PASSWORD:personalbank}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/personalbank}
# Cada serviço usa seu próprio schema no mesmo Postgres.
# "update" mantém os dados entre reinícios; para produção, usar Flyway.
quarkus.hibernate-orm.database.default-schema=consent
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation.create-schemas=true

# ==========================================================
# 5. KAFKA (PRODUCER)
# ==========================================================
kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}
mp.messaging.outgoing.consentimentos-autorizados.connector=smallrye-kafka
mp.messaging.outgoing.consentimentos-autorizados.topic=consentimentos.autorizados
