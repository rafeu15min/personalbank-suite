# Instituições que a suite sabe acessar, com a URL base de cada família de API.
#
# As APIs reais do Open Finance Brasil só aceitam participantes autorizados pelo
# Banco Central (cadastro no diretório, certificados ICP-Brasil, mTLS/FAPI).
# Por isso a suite roda contra o mock-bank, que imita o fluxo e o formato
# dessas APIs com dados fictícios.
#
# Famílias usadas pelos serviços:
#   auth          endpoint de token OAuth 2.0 (ms-consent, servidor-a-servidor)
#   authorize     página para onde o usuário é redirecionado (acessada pelo navegador)
#   consents      criação de consentimentos (ms-consent)
#   accounts      contas e transações (ms-transactions)
#   credit-cards  cartões, faturas e lançamentos (ms-credit-cards)
#   investments   raiz das APIs de investimentos (ms-investments)
# Uma família ausente faz o serviço correspondente ignorar a instituição.
#
# MOCK_BANK_URL é o endereço visto pelos serviços (no docker compose,
# http://mock-bank:8090). MOCK_BANK_PUBLIC_URL é o endereço visto pelo navegador.

personalbank:
  institutions:
    MOCKBANK:
      name: "Mock Bank (local)"
      organizationId: "00000000-0000-0000-0000-000000000000"
      api:
        auth:
          url: "${MOCK_BANK_URL:http://localhost:8090}"
        authorize:
          url: "${MOCK_BANK_PUBLIC_URL:http://localhost:8090}/authorize"
        consents:
          url: "${MOCK_BANK_URL:http://localhost:8090}/open-banking/consents/v3"
        accounts:
          url: "${MOCK_BANK_URL:http://localhost:8090}/open-banking/accounts/v2"
        credit-cards:
          url: "${MOCK_BANK_URL:http://localhost:8090}/open-banking/credit-cards-accounts/v2"
        investments:
          url: "${MOCK_BANK_URL:http://localhost:8090}/open-banking"
