# ==========================================================
# 1. CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ==========================================================
quarkus.application.name=ms-credit-cards
# Porta HTTP única para evitar conflitos locais.
quarkus.http.port=8085

# ==========================================================
# 2. CONFIGURAÇÃO COMPARTILHADA DAS INSTITUIÇÕES
# ==========================================================
# Caminho relativo à pasta do módulo (quarkus:dev). No docker compose é
# sobrescrito por QUARKUS_CONFIG_LOCATIONS=/config/banks.yml.
quarkus.config.locations=../config/banks.yml

# API interna do ms-consent, de onde vem o token de cada consentimento
quarkus.rest-client.ms-consent.url=${MS_CONSENT_URL:http://localhost:8083}

# ==========================================================
# 3. BANCO DE DADOS
# ==========================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:personalbank}
quarkus.datasource.password=${DB_PASSWORD:personalbank}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/personalbank}
# Cada serviço usa seu próprio schema no mesmo Postgres.
# "update" mantém os dados entre reinícios; para produção, usar Flyway.
quarkus.hibernate-orm.database.default-schema=credit_cards
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation.create-schemas=true

# ==========================================================
# 4. KAFKA (CONSUMER)
# ==========================================================
kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}
# Todos os serviços de dados leem o mesmo tópico; o group.id próprio faz cada
# serviço receber todos os eventos.
mp.messaging.incoming.carga-inicial-cartoes.connector=smallrye-kafka
mp.messaging.incoming.carga-inicial-cartoes.topic=consentimentos.autorizados
mp.messaging.incoming.carga-inicial-cartoes.group.id=ms-credit-cards
# Um serviço que sobe depois do evento ainda o processa.
mp.messaging.incoming.carga-inicial-cartoes.auto.offset.reset=earliest
# Eventos que falham vão para o tópico dead-letter-topic-carga-inicial-cartoes em vez de parar o consumo.
mp.messaging.incoming.carga-inicial-cartoes.failure-strategy=dead-letter-queue
mp.messaging.incoming.carga-inicial-cartoes.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
