# Ambiente completo da suite: infraestrutura, banco simulado e os 4 serviços.
#   docker compose up -d --build
# Portas publicadas só em 127.0.0.1: ms-consent (8083), mock-bank (8090) e, para
# rodar um serviço com quarkus:dev fora do compose, Postgres (5432) e Kafka (9092).
# Os demais serviços conversam pela rede interna do compose.

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/personalbank
  DB_USER: personalbank
  DB_PASSWORD: personalbank
  KAFKA_BROKERS: kafka:29092
  MS_CONSENT_URL: http://ms-consent:8083
  MOCK_BANK_URL: http://mock-bank:8090
  QUARKUS_CONFIG_LOCATIONS: /config/banks.yml

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personalbank
      POSTGRES_USER: personalbank
      POSTGRES_PASSWORD: personalbank
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "personalbank"]
      interval: 5s
      retries: 10

  # Kafka em modo KRaft (sem Zookeeper), com um único nó.
  # INTERNAL (kafka:29092) atende os containers; EXTERNAL (localhost:9092), a máquina.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  mock-bank:
    build:
      context: .
      args:
        MODULE: mock-bank
    ports:
      - "127.0.0.1:8090:8090"

  ms-consent:
    build:
      context: .
      args:
        MODULE: ms-consent
    environment:
      <<: *service-env
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?defina TOKEN_ENCRYPTION_KEY no .env (openssl rand -base64 32)}
    volumes:
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      <<: *service-deps
      mock-bank:
        condition: service_started

  ms-transactions:
    build:
      context: .
      args:
        MODULE: ms-transactions
    environment: *service-env
    volumes:
      - ./config:/config:ro
    depends_on: *service-deps

  ms-credit-cards:
    build:
      context: .
      args:
        MODULE: ms-credit-cards
    environment: *service-env
    volumes:
      - ./config:/config:ro
    depends_on: *service-deps

  ms-investments:
    build:
      context: .
      args:
        MODULE: ms-investments
    environment: *service-env
    volumes:
      - ./config:/config:ro
    depends_on: *service-deps

volumes:
  postgres-data:
